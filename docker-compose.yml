name: ledger-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-shot: applies pending migrations and exits. The API never migrates on boot.
  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
