name: ledger-api

x-app: &app
  build: .
  environment:
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Explicit, one-shot migration step. The API never migrates on boot.
  migrate:
    <<: *app
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
